name: Release

# A tag like v1.2.0 pushed on a commit that is in `main` builds Rivet for
# Linux, macOS and Windows and publishes a GitHub Release with the packages.
# The tag is passed to the build (RIVET_VERSION) and shown in Settings.
# "Run workflow" (manual) builds the same packages as artifacts, no release.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      release: ${{ steps.v.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: v
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            git fetch origin main
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "::error::Tag $GITHUB_REF_NAME is not on main — release skipped."
              exit 1
            fi
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  linux:
    needs: meta
    runs-on: ubuntu-22.04
    env:
      RIVET_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: System libraries (GPUI, WebKitGTK)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config clang mold \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libx11-xcb-dev libxcb1-dev libxcb-xkb-dev libxrandr-dev libxi-dev \
            libvulkan-dev libfontconfig1-dev libfreetype6-dev libasound2-dev \
            libssl-dev libzstd-dev \
            libgtk-3-dev libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rivet-linux
          path: target/linux-release/*.tar.gz

  macos:
    needs: meta
    runs-on: macos-14
    env:
      RIVET_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/package-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: rivet-macos
          path: |
            target/macos-release/*.dmg
            target/macos-release/*.zip

  windows:
    needs: meta
    runs-on: windows-2022
    env:
      RIVET_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup update stable
      - uses: Swatinem/rust-cache@v2
      - name: Build and package
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: rivet-windows
          path: target/windows-release/*.zip

  release:
    needs: [meta, linux, macos, windows]
    if: needs.meta.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # The in-app updater verifies the downloaded package against this file.
      - name: Checksums (SHA256SUMS)
        shell: bash
        run: |
          cd dist
          files=$(find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | sort)
          [ -n "$files" ] || { echo "::error::dist is empty"; exit 1; }
          sha256sum $files > ../SHA256SUMS
          mv ../SHA256SUMS SHA256SUMS
          cat SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          name: Rivet ${{ needs.meta.outputs.version }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*
