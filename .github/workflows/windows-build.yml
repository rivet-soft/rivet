name: Windows build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Update Rust
        run: rustup update stable
      - name: Build and package Rivet
        shell: pwsh
        run: ./scripts/build-windows.ps1
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Rivet-windows-x64
          path: target/windows-release/*.zip
